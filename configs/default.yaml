# Run configuration. Every tunable lives here so a run is reproducible from (data, config, seed).
seed: 42

split:
  test_size: 0.2         # held-out evaluation set
  calibration_size: 0.15 # carved from the remaining data, used only to fit the calibrator

models:
  champion: lightgbm     # which model's calibrated scores drive ranking and explanations
  logistic_regression:
    C: 0.5
    max_iter: 2000
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 60
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    monotone: true       # enforce risk direction on the features listed below

# +1: risk may only increase with the feature; -1: may only decrease.
monotone_constraints:
  pay_status_recent: 1
  delinquency_streak: 1
  months_delinquent: 1
  max_delay: 1
  utilization_recent: 1
  payment_ratio_mean: -1

calibration:
  method: isotonic       # isotonic | platt
  n_bins: 10             # reliability curve / ECE bins

# Illustrative economics of working one account in the queue. Not real figures; tune per portfolio.
economics:
  cost_per_contact: 60.0           # analyst time + outreach cost for every account worked
  loss_given_default: 4000.0       # exposure lost if a defaulter is not worked
  cure_rate_if_worked: 0.10        # share of defaulters a contact prevents from defaulting

ranking:
  capacity: 1000         # accounts the team can work per cycle (CLI default)
  top_k_percents: [1, 5, 10, 20]

explain:
  n_reasons: 4
